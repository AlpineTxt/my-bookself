<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader | MY BOOK SELF</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }

        body {
            background: #1a1a2e;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
        }

        .reader-topbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 2rem;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .reader-topbar a {
            color: #f43f5e;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .reader-topbar .book-name {
            color: white;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .page-info {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        /* Flipbook Stage */
        .flipbook-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1.5rem 1rem;
            perspective: 2500px;
        }

        .book-wrapper {
            position: relative;
            display: flex;
            align-items: stretch;
            border-radius: 4px;
            box-shadow:
                0 30px 80px rgba(0,0,0,0.8),
                0 0 0 1px rgba(255,255,255,0.05);
        }

        /* Page containers */
        .page-container {
            position: relative;
            width: 57vw;
            max-width: 520px;
            height: 80vh;
            overflow: hidden;
        }

        .page-container.left {
            border-radius: 4px 0 0 4px;
            border-right: 2px solid rgba(0,0,0,0.3);
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.2);
        }

        .page-container.right {
            border-radius: 0 4px 4px 0;
            border-left: 2px solid rgba(0,0,0,0.3);
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.2);
        }

        canvas.page-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #fff;
        }

        /* Flip animation overlay */
        .flip-overlay {
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            z-index: 10;
            pointer-events: none;
        }

        .flip-overlay.flipping-forward {
            animation: flipForward 0.7s cubic-bezier(0.645, 0.045, 0.355, 1.000) forwards;
        }

        .flip-overlay.flipping-backward {
            animation: flipBackward 0.7s cubic-bezier(0.645, 0.045, 0.355, 1.000) forwards;
        }

        @keyframes flipForward {
            0%   { transform: rotateY(0deg); box-shadow: none; }
            40%  { box-shadow: -15px 0 30px rgba(0,0,0,0.4); }
            100% { transform: rotateY(-180deg); box-shadow: none; }
        }

        @keyframes flipBackward {
            0%   { transform: rotateY(-180deg); box-shadow: none; }
            40%  { box-shadow: -15px 0 30px rgba(0,0,0,0.4); }
            100% { transform: rotateY(0deg); box-shadow: none; }
        }

        /* Spine */
        .book-spine {
            width: 12px;
            background: linear-gradient(to right, #2d2d2d, #555, #2d2d2d);
            box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
            flex-shrink: 0;
            z-index: 5;
        }

        /* Nav controls */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding: 1rem 2rem;
            background: rgba(255,255,255,0.04);
            border-top: 1px solid rgba(255,255,255,0.08);
            width: 100%;
            justify-content: center;
        }

        .nav-btn {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            color: white;
            padding: 0.6rem 2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            gap: 1.5rem;
        }

        .loading-screen p {
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #f43f5e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>Opening your book...</p>
    </div>

    <div class="reader-topbar">
        <a href="index.html">← Exit Reader</a>
        <span class="book-name" id="topbarTitle">THAT ONE DAY</span>
        <span class="page-info" id="pageInfo">Page — of —</span>
    </div>

    <div class="flipbook-stage">
        <div class="book-wrapper" id="bookWrapper">
            <div class="page-container left" id="leftPage">
                <canvas class="page-canvas" id="leftCanvas"></canvas>
            </div>
            <div class="book-spine"></div>
            <div class="page-container right" id="rightPage">
                <canvas class="page-canvas" id="rightCanvas"></canvas>
                <div class="flip-overlay" id="flipOverlay"></div>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn">◀ Previous</button>
        <button class="nav-btn" id="nextBtn">Next ▶</button>
    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || 'THAT ONE DAY';
        document.getElementById('topbarTitle').innerText = title;

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentSpread = 1; // left page number (odd = left, even pairs)
        let totalPages = 0;
        let isFlipping = false;

        const leftCanvas  = document.getElementById('leftCanvas');
        const rightCanvas = document.getElementById('rightCanvas');
        const flipOverlay = document.getElementById('flipOverlay');
        const pageInfo    = document.getElementById('pageInfo');
        const prevBtn     = document.getElementById('prevBtn');
        const nextBtn     = document.getElementById('nextBtn');

        async function renderPage(pageNum, canvas) {
            if (pageNum < 1 || pageNum > totalPages) {
                const ctx = canvas.getContext('2d');
                canvas.width  = canvas.offsetWidth  || 520;
                canvas.height = canvas.offsetHeight || 700;
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            const page = await pdfDoc.getPage(pageNum);
            const container = canvas.parentElement;
            const vp0 = page.getViewport({ scale: 1 });
            const scale = (container.clientHeight || 700) / vp0.height;
            const viewport = page.getViewport({ scale });
            canvas.width  = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }

        async function showSpread(leftNum, animate, direction) {
            const rightNum = leftNum + 1;

            if (animate) {
                isFlipping = true;
                flipOverlay.className = 'flip-overlay';
                // trigger reflow
                void flipOverlay.offsetWidth;
                flipOverlay.classList.add(direction === 'forward' ? 'flipping-forward' : 'flipping-backward');
                await new Promise(r => setTimeout(r, 350));
            }

            await Promise.all([
                renderPage(leftNum, leftCanvas),
                renderPage(rightNum, rightCanvas)
            ]);

            if (animate) {
                await new Promise(r => setTimeout(r, 360));
                flipOverlay.className = 'flip-overlay';
                isFlipping = false;
            }

            pageInfo.textContent = `Pages ${leftNum}–${Math.min(rightNum, totalPages)} of ${totalPages}`;
            prevBtn.disabled = leftNum <= 1;
            nextBtn.disabled = leftNum + 2 > totalPages;
        }

        async function loadPDF() {
            const pdfPath = 'THAT ONE DAY (english version).pdf';
            try {
                // XHR works on file:// protocol unlike fetch()
                const arrayBuffer = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', pdfPath, true);
                    xhr.responseType = 'arraybuffer';
                    xhr.onload = () => {
                        if (xhr.status === 200 || xhr.status === 0) {
                            resolve(xhr.response);
                        } else {
                            reject(new Error('HTTP ' + xhr.status));
                        }
                    };
                    xhr.onerror = () => reject(new Error('Network error loading PDF'));
                    xhr.send();
                });

                pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                totalPages = pdfDoc.numPages;
                await showSpread(1, false, null);
                document.getElementById('loadingScreen').style.display = 'none';
            } catch (e) {
                document.getElementById('loadingScreen').innerHTML = `
                    <p style="color:#f43f5e;text-align:center;max-width:400px;">
                        ⚠️ Failed to load PDF.<br><br>
                        <span style="font-size:0.85rem;opacity:0.7;">Make sure the file <strong>"THAT ONE DAY (english version).pdf"</strong> 
                        is in the same folder as this page.<br><br>Error: ${e.message}</span>
                    </p>
                    <a href="index.html" style="color:#f43f5e;margin-top:1rem;font-weight:700;">← Go Back</a>
                `;
            }
        }

        nextBtn.addEventListener('click', async () => {
            if (isFlipping || currentSpread + 2 > totalPages) return;
            currentSpread += 2;
            await showSpread(currentSpread, true, 'forward');
        });

        prevBtn.addEventListener('click', async () => {
            if (isFlipping || currentSpread <= 1) return;
            currentSpread -= 2;
            await showSpread(currentSpread, true, 'backward');
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft')  prevBtn.click();
        });

        loadPDF();
    </script>
</body>
</html>
