<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reader | MY BOOK SELF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f14;
            --surface: #1a1a22;
            --border: rgba(255,255,255,0.08);
            --accent: #c9a84c;
            --accent-glow: rgba(201,168,76,0.25);
            --text: #f0ece2;
            --text-dim: rgba(240,236,226,0.5);
        }

        html, body {
            height: 100%; width: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ── Layout ── */
        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* ── Top Bar ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.55rem 1.2rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 50;
            flex-shrink: 0;
            gap: 1rem;
        }
        .topbar-left { display: flex; align-items: center; gap: 0.9rem; }
        .back-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.38rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: border-color 0.2s, color 0.2s;
            text-decoration: none;
            font-family: inherit;
            white-space: nowrap;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        .topbar-title {
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }
        .topbar-badge {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 0.22rem 0.65rem;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(201,168,76,0.18), rgba(201,168,76,0.08));
            border: 1px solid rgba(201,168,76,0.3);
            color: var(--accent);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .topbar-right { display: flex; align-items: center; gap: 0.65rem; flex-shrink: 0; }

        .tool-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 34px; height: 34px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }
        .tool-btn:hover { color: var(--accent); border-color: var(--accent); }
        .tool-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        /* ── Flipbook Frame ── */
        .flipbook-stage {
            flex: 1;
            position: relative;
            background: var(--bg);
            overflow: hidden;
        }

        #flipbookFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ── Loading Splash ── */
        .frame-loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.4rem;
            background: var(--bg);
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .frame-loader.hidden { opacity: 0; pointer-events: none; }

        .loader-book {
            font-size: 3.5rem;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .loader-ring {
            width: 44px; height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            color: var(--text-dim);
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .loader-subtext {
            color: rgba(240,236,226,0.3);
            font-size: 0.72rem;
            margin-top: -0.8rem;
        }

        /* ── Fallback Banner ── */
        .fallback-banner {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            background: var(--bg);
            z-index: 20;
            padding: 2rem;
            text-align: center;
        }
        .fallback-banner.show { display: flex; }
        .fallback-banner h3 { font-size: 1.1rem; color: var(--text); }
        .fallback-banner p { color: var(--text-dim); font-size: 0.85rem; line-height: 1.6; max-width: 360px; }
        .open-external-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.7rem 1.6rem;
            background: linear-gradient(135deg, var(--accent), #e8c46a);
            color: #0f0f14;
            border: none; border-radius: 10px;
            font-weight: 700; font-size: 0.85rem;
            cursor: pointer; text-decoration: none;
            font-family: inherit;
            transition: opacity 0.2s, transform 0.2s;
        }
        .open-external-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* ── Mobile ── */
        @media (max-width: 480px) {
            .topbar { padding: 0.45rem 0.8rem; gap: 0.6rem; }
            .topbar-title { font-size: 0.78rem; max-width: 160px; }
            .topbar-badge { display: none; }
            .tool-btn { width: 30px; height: 30px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-left">
            <a href="index.html" class="back-btn" id="backBtn">← Back</a>
            <span class="topbar-title" id="topbarTitle">Book</span>
            <span class="topbar-badge">✦ Flipbook</span>
        </div>
        <div class="topbar-right">
            <button class="tool-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
            <a class="tool-btn" id="externalBtn" title="Open in new tab" target="_blank" rel="noopener">↗</a>
        </div>
    </div>

    <!-- Flipbook Stage -->
    <div class="flipbook-stage" id="flipbookStage">

        <!-- Loading Splash -->
        <div class="frame-loader" id="frameLoader">
            <div class="loader-book">📖</div>
            <div class="loader-ring"></div>
            <p class="loader-text">Opening your flipbook…</p>
            <p class="loader-subtext">Powered by HeyZine</p>
        </div>

        <!-- Fallback (shown if iframe blocked) -->
        <div class="fallback-banner" id="fallbackBanner">
            <div style="font-size:2.5rem">📚</div>
            <h3>Open Flipbook</h3>
            <p>Your browser has blocked the embedded flipbook. Click below to read it in a new tab for the best experience.</p>
            <a class="open-external-btn" id="fallbackLink" href="#" target="_blank" rel="noopener">
                🔗 Open Flipbook
            </a>
        </div>

        <!-- HeyZine iframe -->
        <iframe
            id="flipbookFrame"
            title="Book Flipbook"
            allowfullscreen
            allow="fullscreen"
            loading="eager"
        ></iframe>

    </div>
</div>

<script>
    // ── Read URL params ──
    const params = new URLSearchParams(window.location.search);
    const title   = decodeURIComponent(params.get('title')  || 'Book');
    const author  = decodeURIComponent(params.get('author') || '');
    const flipUrl = decodeURIComponent(params.get('flip')   || 'https://heyzine.com/flip-book/05d20dcb10.html');

    // ── Populate topbar ──
    document.getElementById('topbarTitle').textContent = title + (author ? ` — ${author}` : '');
    document.title = `${title} | MY BOOK SELF`;

    // ── Set external link ──
    document.getElementById('externalBtn').href = flipUrl;
    document.getElementById('fallbackLink').href = flipUrl;

    // ── Load iframe ──
    const frame  = document.getElementById('flipbookFrame');
    const loader = document.getElementById('frameLoader');
    const fallback = document.getElementById('fallbackBanner');

    frame.src = flipUrl;

    // Hide loader when frame loads
    frame.addEventListener('load', () => {
        setTimeout(() => loader.classList.add('hidden'), 600);
    });

    // Safety timeout — if frame didn't fire load in 12s, show fallback hint
    const safetyTimer = setTimeout(() => {
        // Only show fallback if loader is still visible
        if (!loader.classList.contains('hidden')) {
            loader.classList.add('hidden');
            fallback.classList.add('show');
        }
    }, 12000);

    frame.addEventListener('load', () => clearTimeout(safetyTimer));

    // ── Fullscreen ──
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
        const stage = document.getElementById('flipbookStage');
        if (!document.fullscreenElement) {
            (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
        } else {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
    });

    document.addEventListener('fullscreenchange', () => {
        const btn = document.getElementById('fullscreenBtn');
        btn.classList.toggle('active', !!document.fullscreenElement);
        btn.title = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    });

    // ── Keyboard shortcuts ──
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !document.fullscreenElement) {
            window.location.href = 'index.html';
        }
        if (e.key === 'F11') {
            e.preventDefault();
            document.getElementById('fullscreenBtn').click();
        }
    });
</script>

</body>
</html>
