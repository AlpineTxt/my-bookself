<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 MY BOOK SELF</title>
    <meta name="description" content="My personal book collection.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 MY BOOK SELF</h1>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search books…" autocomplete="off">
        </div>
    </header>

    <main id="bookGrid"></main>

    <section class="upcoming-section">
        <h2 class="section-title">Upcoming Books</h2>
        <div class="upcoming-grid">
            <!-- Book 1 -->
            <div class="upcoming-card">
                <div class="upcoming-cover">
                    <img src="resonance.png" alt="Resonance Book Cover">
                </div>
                <h3 class="upcoming-title">RESONANCE</h3>
            </div>
        </div>
    </section>

    <div id="emptyState" class="empty" style="display:none;">
        <p>No books found.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
