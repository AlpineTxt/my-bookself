<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY BOOK SELF | Personal Library</title>
    <meta name="description" content="A personal digital bookshelf — curated reads, all in one place.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ── Header ── -->
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <span class="logo-text">MY BOOK <em>SELF</em></span>
            </div>
            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search your shelf…" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </header>

    <!-- ── Hero Banner ── -->
    <section class="hero">
        <div class="hero-inner">
            <div class="hero-text">
                <p class="hero-label">Personal Library</p>
                <h1 class="hero-title">My Reading<br><em>Collection</em></h1>
                <p class="hero-desc">Books I'm reading, have finished, and want to explore — all in one place.</p>
            </div>
            <div class="hero-stats" id="heroStats">
                <!-- filled by JS -->
            </div>
        </div>
    </section>

    <!-- ── Books Grid ── -->
    <main class="main-content">
        <div class="section-label" id="sectionLabel">All Books</div>
        <div class="book-grid" id="bookGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <span class="empty-icon">📭</span>
            <h3>No books found</h3>
            <p>Try a different search term.</p>
        </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="site-footer">
        <p>MY BOOK SELF &nbsp;·&nbsp; Built with ❤️ by <a href="https://github.com/AlpineTxt" target="_blank">AlpineTxt</a></p>
    </footer>

    <!-- Hidden stubs for script compat -->
    <div id="modalOverlay" style="display:none;"></div>
    <form id="addBookForm" style="display:none;"></form>
    <div id="filterBar" style="display:none;"></div>

    <script src="script.js"></script>
</body>
</html>
