<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY BOOK SELF | Personal Library</title>
    <meta name="description" content="A personal digital bookshelf — curated reads, all in one place.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <span class="logo-text">MY BOOK <em>SELF</em></span>
            </div>
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search books...">
            </div>
        </div>
    </header>

    <!-- Page Title -->
    <section class="hero">
        <div class="container">
            <h1 class="hero-title">My Reading Collection</h1>
            <p class="hero-sub">A curated shelf of books I love, am reading, and want to explore.</p>
        </div>
    </section>

    <!-- Book Grid -->
    <main class="container">
        <div class="book-grid" id="bookGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="empty-icon">📭</div>
            <h3>No books found</h3>
            <p>Try a different search term.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>MY BOOK SELF &nbsp;·&nbsp; Built with ❤️ by <a href="https://github.com/AlpineTxt" target="_blank">AlpineTxt</a></p>
    </footer>

    <!-- Hidden required elements for script compatibility -->
    <div id="modalOverlay" style="display:none;"></div>
    <form id="addBookForm" style="display:none;"></form>
    <div id="filterBar" style="display:none;"></div>

    <script src="script.js"></script>
</body>
</html>
