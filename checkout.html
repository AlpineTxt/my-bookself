<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | MY BOOK SELF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #14141c; --border: rgba(255,255,255,0.08);
            --accent: #c9a84c; --accent-glow: rgba(201,168,76,0.25);
            --text: #f0ece2; --text-dim: rgba(240,236,226,0.5);
            --danger: #e74c5e; --success: #4ade80;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 2rem;
        }
        .checkout-wrap { width: 100%; max-width: 520px; }
        .back-link {
            display: inline-flex; align-items: center; gap: 0.4rem;
            color: var(--accent); text-decoration: none; font-weight: 600;
            font-size: 0.85rem; margin-bottom: 1.5rem; transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 0.7; }
        .checkout-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 24px; padding: 2.5rem; position: relative; overflow: hidden;
        }
        .checkout-card::before {
            content: ''; position: absolute; top: -50%; right: -30%;
            width: 300px; height: 300px; border-radius: 50%;
            background: var(--accent); opacity: 0.03; pointer-events: none;
        }
        .checkout-title {
            font-family: 'Cormorant Garamond', serif; font-size: 1.8rem;
            font-weight: 700; margin-bottom: 2rem;
        }
        .order-box {
            background: rgba(255,255,255,0.03); border: 1px dashed var(--border);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem;
        }
        .order-book { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
        .order-author { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 1.2rem; }
        .order-total {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--border); padding-top: 1rem;
            font-weight: 700; font-size: 1.2rem;
        }
        .order-total .price { color: var(--accent); }
        .payment-label { font-weight: 600; color: var(--text-dim); font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.8rem; }
        .pay-options { display: flex; gap: 0.8rem; margin-bottom: 2rem; }
        .pay-opt {
            flex: 1; padding: 0.9rem; text-align: center; font-weight: 700;
            border-radius: 12px; cursor: pointer; transition: all 0.2s;
            font-size: 0.9rem; border: 2px solid var(--border);
            background: rgba(255,255,255,0.03); color: var(--text-dim);
        }
        .pay-opt.selected { border-color: var(--accent); color: var(--accent); background: rgba(201,168,76,0.08); }
        .pay-opt:hover { border-color: rgba(255,255,255,0.2); }
        .pay-btn {
            width: 100%; padding: 1rem; border: none; border-radius: 14px;
            background: var(--accent); color: var(--bg); font-weight: 700;
            font-size: 1rem; cursor: pointer; transition: all 0.3s;
            font-family: inherit;
        }
        .pay-btn:hover { box-shadow: 0 10px 30px var(--accent-glow); transform: translateY(-2px); }
        .secure-note {
            text-align: center; margin-top: 1rem; font-size: 0.75rem;
            color: var(--text-dim);
        }
        @media (max-width: 480px) {
            body { padding: 1rem; }
            .checkout-card { padding: 1.5rem; border-radius: 18px; }
        }
    </style>
</head>
<body>
    <div class="checkout-wrap">
        <a href="index.html" class="back-link">← Cancel & Go Back</a>
        <div class="checkout-card">
            <h1 class="checkout-title">Secure Checkout</h1>
            <div class="order-box">
                <p class="order-book" id="bookTitle">Book Title</p>
                <p class="order-author" id="bookAuthor">Author</p>
                <div class="order-total">
                    <span>Total</span>
                    <span class="price">$19.99</span>
                </div>
            </div>
            <p class="payment-label">Payment Method</p>
            <div class="pay-options">
                <div class="pay-opt selected" onclick="selectPay(this)">💳 Card</div>
                <div class="pay-opt" onclick="selectPay(this)">🅿️ PayPal</div>
                <div class="pay-opt" onclick="selectPay(this)">📱 UPI</div>
            </div>
            <button class="pay-btn" onclick="completePurchase()">Complete Purchase</button>
            <p class="secure-note">🔒 Your payment is secured with 256-bit encryption</p>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('title')) document.getElementById('bookTitle').textContent = decodeURIComponent(params.get('title'));
        if (params.get('author')) document.getElementById('bookAuthor').textContent = decodeURIComponent(params.get('author'));
        function selectPay(el) {
            document.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }
        function completePurchase() {
            alert('Thank you for your purchase! 🎉');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
