<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | MY BOOK SELF</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 3rem;
            background: white;
            border-radius: 32px;
            border: 3px solid var(--text-main);
            box-shadow: 15px 15px 0px var(--text-main);
        }
        .order-summary {
            background: #f8fafc;
            padding: 2rem;
            border-radius: 20px;
            margin: 2rem 0;
            border: 2px dashed var(--border-light);
        }
        .payment-method {
            display: grid;
            gap: 1rem;
            margin-top: 2rem;
        }
        .pay-btn {
            background: var(--text-main);
            color: white;
            padding: 1.2rem;
            border-radius: 15px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition-bounce);
        }
        .pay-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(30, 41, 59, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 700;">← Cancel Order</a>
        <div class="checkout-container">
            <h1 class="logo" style="font-size: 2rem; margin-bottom: 2rem;">Secure Checkout</h1>
            
            <div class="order-summary">
                <h3 id="bookTitle" style="margin-bottom: 0.5rem;">Book Title</h3>
                <p id="bookAuthor" style="color: var(--text-muted); margin-bottom: 1.5rem;">Author Name</p>
                <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; border-top: 1px solid var(--border-light); padding-top: 1rem;">
                    <span>Total</span>
                    <span>$19.99</span>
                </div>
            </div>

            <div class="payment-method">
                <p style="font-weight: 600; color: var(--text-muted);">Select Payment Method</p>
                <div style="display: flex; gap: 1rem;">
                    <div style="flex: 1; padding: 1rem; border: 2px solid var(--text-main); border-radius: 12px; text-align: center; font-weight: 700;">Card</div>
                    <div style="flex: 1; padding: 1rem; border: 2px solid var(--border-light); border-radius: 12px; text-align: center; font-weight: 700; color: var(--text-muted);">PayPal</div>
                </div>
            </div>

            <button class="pay-btn" style="width: 100%; margin-top: 2rem;">Complete Purchase</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title');
        const author = params.get('author');
        
        if (title) document.getElementById('bookTitle').innerText = title;
        if (author) document.getElementById('bookAuthor').innerText = author;
    </script>
</body>
</html>
